<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>MangaHub — Discover</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">📚</div>
        <div class="logo-text">Manga<span>Hub</span></div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-label">Browse</div>
          <a href="home.html" class="nav-link active">
            <span class="nav-icon">🏠</span> Discover
          </a>
          <a href="library.html" class="nav-link">
            <span class="nav-icon">📚</span> My Library
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-label">System</div>
          <a href="#" class="nav-link" id="health-link">
            <span class="nav-icon">❤️</span> Health Check
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar" id="sidebar-avatar">?</div>
          <div class="user-info">
            <div class="user-name" id="sidebar-username">Loading…</div>
            <div class="user-role">Reader</div>
          </div>
          <button class="btn-logout" id="btn-logout" title="Sign out">🚪</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div style="display:flex;align-items:center;gap:14px">
          <button class="btn btn-ghost btn-sm" id="btn-menu" style="display:none">☰</button>
          <div>
            <h1 class="page-title" style="font-size:1.3rem">Discover Manga</h1>
            <div style="font-size:0.78rem;color:var(--text-muted)" id="manga-count">Loading…</div>
          </div>
        </div>

        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="search-input" placeholder="Search by title or author…" />
        </div>
      </header>

      <div class="page-body">
        <section id="continue-section" style="display:none;margin-bottom:32px">
          <div class="section-header">
            <div class="section-title">Continue Reading</div>
          </div>
          <div class="manga-grid" id="continue-grid"></div>
        </section>

        <div style="margin-bottom:20px">
          <div class="filter-tabs" id="genre-tabs"></div>
        </div>

        <section>
          <div class="section-header">
            <div class="section-title">All Manga</div>
          </div>
          <div class="manga-grid" id="manga-grid">
            <div class="loading-spinner" style="grid-column:1/-1"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="health-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">System Health</h3>
        <button class="modal-close" id="health-modal-close">✕</button>
      </div>
      <div class="modal-body" id="health-modal-body">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initHome } from './js/home.js';
    import { apiHealth } from './js/api.js';
    import { logout } from './js/auth.js';

    initHome();

    document.getElementById('health-link')?.addEventListener('click', async (e) => {
      e.preventDefault();
      const modal = document.getElementById('health-modal');
      const body  = document.getElementById('health-modal-body');
      modal.style.display = 'flex';
      body.innerHTML = '<div class="loading-spinner"></div>';

      try {
        const data = await apiHealth();
        const services = Array.isArray(data.services) ? data.services : [];

        body.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border)">
              <span style="font-weight:600;font-family:'Rajdhani',sans-serif">Overall Status</span>
              <span class="stat-chip ${data.status === 'healthy' ? 'green' : 'orange'}">${data.status}</span>
            </div>
            <div style="font-size:0.72rem;color:var(--text-muted);padding:0 4px;letter-spacing:0.05em;text-transform:uppercase">Services</div>
            ${services.map(s => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border)">
                <div>
                  <div style="font-weight:600;font-family:'Rajdhani',sans-serif;font-size:0.95rem">${s.name}</div>
                  ${s.details ? `<div style="font-size:0.72rem;color:var(--text-muted);margin-top:2px">${s.details}</div>` : ''}
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  ${s.port ? `<span style="font-size:0.72rem;color:var(--text-muted)">:${s.port}</span>` : ''}
                  <span class="stat-chip ${s.status === 'up' ? 'green' : 'orange'}">${s.status}</span>
                </div>
              </div>
            `).join('')}
            <div style="font-size:0.72rem;color:var(--text-muted);text-align:right;padding:0 4px">
              Last checked: ${new Date(data.timestamp * 1000).toLocaleTimeString()}
            </div>
          </div>
        `;
      } catch (err) {
        body.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">${err.message}</div></div>`;
      }
    });

    document.getElementById('health-modal-close')?.addEventListener('click', () => {
      document.getElementById('health-modal').style.display = 'none';
    });

    document.getElementById('health-modal')?.addEventListener('click', (e) => {
      if (e.target === document.getElementById('health-modal')) {
        document.getElementById('health-modal').style.display = 'none';
      }
    });

    document.getElementById('btn-menu').style.display = window.innerWidth < 900 ? 'flex' : 'none';
    window.addEventListener('resize', () => {
      document.getElementById('btn-menu').style.display = window.innerWidth < 900 ? 'flex' : 'none';
    });
  </script>
</body>
</html>
